# Research Wiki Factory Configuration
# ====================================

# Topics to process.
# Simple form (each topic uses default inbox ~/Prog/research-wiki-factory/inbox/<topic>):
#   topics: [llm-agents]
#
# Mapping form (recommended for multiple topics) — per-topic options:
#   inbox:        override inbox dir; point it at a shared library dir and
#                 the watcher will pick matching papers out of it (recursively)
#   seed_queries: extra S2 keyword queries for the sweep (optional)
topics:
  llm-agents:
    # inbox: ~/Prog/research-wiki-factory/inbox/llm-agents   # default; override example below
    # seed_queries: ["LLM agents tool use", "multi-agent LLM systems"]

# Example with a second topic sharing one big PDF library:
# topics:
#   llm-agents:
#     inbox: ~/ZoteroLibrary
#   mechanistic-interpretability:
#     inbox: ~/ZoteroLibrary
#     seed_queries: ["mechanistic interpretability transformer circuits"]

# Litellm configuration
litellm:
  base_url: "http://YOUR-LITELLM-HOST:4000/v1/"
  embedding_model: "qwen3-embedding-8b"
  embedding_dim: 4096

# Semantic Scholar configuration
semantic_scholar:
  citation_cap: 25

# Attanger/Zotero file renaming template (Zotero 7 syntax, paste verbatim
# from Zotero settings -> General -> Filename Format). Single-quoted YAML
# scalar: double quotes inside need no escaping.
attanger_pattern:
  rename_template: '{{ firstCreator suffix=" - " }}{{ year suffix=" - " }}{{ title truncate="100" }}'

# Zotero export path
zotero:
  exports_dir: "~/Prog/research-wiki-factory/zotero/exports"
  # Export filename pattern: wiki-<topic>.bib

# Inbox directory
inbox:
  base_dir: "~/Prog/research-wiki-factory/inbox"

# Wiki output directory
wiki:
  base_dir: "~/Prog/research-wiki-factory/wikis"
